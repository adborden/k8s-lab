---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

helmCharts:
  - name: k8s-gateway
    includeCRDs: true
    repo: oci://codeberg.org/k8s-gateway/charts
    releaseName: k8s-gateway
    version: 4.0.1
    valuesInline:
      servers:
        - zones:
            - zone: .
          port: 53
          plugins:
            - name: errors
            - name: health
              configBlock: |-
                lameduck 10s
            - name: ready
            - name: k8s_gateway
              parameters: fl.a14n.net lunarkittylanding.party
              configBlock: |-
                resources Ingress Service
                loadBalancerAddressPreference ip
            - name: forward
              parameters: . /etc/resolv.conf
            - name: cache
              parameters: 30
            - name: reload
            - name: loadbalance
