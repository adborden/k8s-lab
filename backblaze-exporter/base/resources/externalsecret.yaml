---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backblaze-exporter-credentials
  labels:
    app.kubernetes.io/name: backblaze-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: backblaze-exporter-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: backblaze-exporter/default
