---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: backblaze-exporter
spec:
  provider:
    vault:
      server: https://vault.fl.a14n.net
      # KV v2 secrets engine mount, patched per environment
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: backblaze-exporter
          serviceAccountRef:
            name: backblaze-exporter-vault
