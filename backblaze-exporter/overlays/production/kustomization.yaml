---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: backblaze-exporter-config
    behavior: merge
    files:
      - B2_BUCKETS_CONFIG=files/buckets.json

images:
  - name: t0mmili/backblaze-prometheus-exporter
    newName: ghcr.io/adborden/backblaze-prometheus-exporter
    newTag: latest

patches:
  - target:
      kind: ExternalSecret
      name: backblaze-exporter-credentials
    patch: |-
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: fl.a14n.net/production/backblaze-b2-exporter/default
