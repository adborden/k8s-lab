---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gcp-janitor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: manifests/overlays/production
    repoURL: https://github.com/adborden/gcp-janitor.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: gcp-janitor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
