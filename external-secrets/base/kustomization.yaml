---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: external-secrets
    includeCRDs: true
    repo: https://charts.external-secrets.io
    releaseName: external-secrets
    namespace: external-secrets
    version: 2.15.0
    valuesInline:
      metrics:
        service:
          enabled: true
      serviceMonitor:
        enabled: true
